# Mẫu triển khai cục bộ / tự lưu trữ (self-hosted) cho M365-Codex
#
# Hướng dẫn sử dụng:
#   1. Tại thư mục gốc của kho lưu trữ, sao chép .env.example thành .env và điền các trường bắt buộc
#   2. Chạy: docker compose -f docker/docker-compose.yml up -d
#
# Lưu ý: .env chứa khóa chính (Master Key) và mật khẩu quản trị, tuyệt đối không commit lên bất kỳ kho lưu trữ nào.

services:
  m365-codex:
    # Image được phát hành trên Docker Hub. Có thể dùng M365_CODEX_IMAGE để ghi đè phiên bản cụ thể, ví dụ:
    # M365_CODEX_IMAGE=foch0x97/m365-codex:0.9.1
    image: ${M365_CODEX_IMAGE:-foch0x97/m365-codex:latest}
    # Nếu muốn tự xây dựng image cục bộ, hãy bỏ chú thích các dòng bên dưới:
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    container_name: m365-codex
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: "8080"
      DATA_DIR: /data
    ports:
      - "8080:8080"
    volumes:
      - m365-codex-data:/data
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  m365-codex-data:
