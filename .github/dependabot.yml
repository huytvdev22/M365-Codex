version: 2

# Tự động cập nhật các thư viện phụ thuộc và GitHub Actions (tương ứng với kế hoạch thực thi §20.3).
#
# Ba hệ sinh thái npm độc lập với nhau: workspace gốc (server + shared package), giao diện quản trị (apps/web), và probe.
# Chúng sử dụng các lockfile riêng biệt, việc gộp chung để cập nhật sẽ gây xung đột và ràng buộc lẫn nhau.
#
# Chiến lược gộp PR: Phân nhóm tạo PR để tránh việc hàng chục PR đơn lẻ làm tràn danh sách; các bản cập nhật bảo mật không phân nhóm
# để chúng xuất hiện riêng biệt, rõ ràng hơn.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      phụ-thuộc-production:
        dependency-type: production
      phụ-thuộc-phát-triển:
        dependency-type: development

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      phụ-thuộc-giao-diện-quản-trị:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /probe
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      phụ-thuộc-probe:
        patterns: ['*']

  # Các Action luôn được ghim theo commit SHA, Dependabot sẽ cập nhật cả số phiên bản trong phần chú thích
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      phụ-thuộc-workflow:
        patterns: ['*']
