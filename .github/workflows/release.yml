name: Phát hành image

# Đẩy lên Docker Hub. Repository image và chứng chỉ lấy từ cấu hình kho:
#   secrets.DOCKERHUB_USERNAME / secrets.DOCKERHUB_TOKEN
#   vars.DOCKERHUB_REPOSITORY (ví dụ: m365-codex)
# Tên image: <DOCKERHUB_USERNAME>/<DOCKERHUB_REPOSITORY>.
#
# Chiến lược gắn thẻ (tag):
#   push lên main      → main, sha-<mã băm ngắn>
#   tạo tag v*         → phiên bản đầy đủ, phiên bản chính.phụ (ví dụ v0.4.0 → 0.4.0, 0.4)
#   Release chính thức → latest (chỉ trường hợp này mới cập nhật thẻ latest)
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Chữ ký không dùng khóa của cosign dùng token OIDC để đổi chứng chỉ ngắn hạn
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Hàng rào kiểm soát phát hành. Kế hoạch yêu cầu "lỗ hổng mức độ cao, quét chứng chỉ thất bại, test thất bại đều phải chặn phát hành",
  # nhưng ci.yml chỉ kích hoạt khi push vào main và tạo PR — **nhánh tạo tag phiên bản hoàn toàn không chạy CI**.
  # Vì vậy tại đây trên quy trình phát hành cần chạy lại các bước kiểm tra tương tự và yêu cầu publish phải phụ thuộc vào bước này.
  gate:
    name: Hàng rào kiểm soát trước phát hành (Kiểu / Lint / Test / Lỗ hổng / Chứng chỉ)
    runs-on: ubuntu-latest
    if: ${{ vars.DOCKERHUB_REPOSITORY != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Kiểm tra giao diện quản trị
        run: |
          npm ci --prefix apps/web
          npm run typecheck:web
          npm run test:web
          npm run build --prefix apps/web
      - name: Quét rò rỉ chứng chỉ xác thực
        run: |
          set -euo pipefail
          if git ls-files | grep -Ev '(^|/)\.env\.example$' | grep -E '(^|/)(\.env($|\.)|accounts?\.json|tokens?\.json|cookies\.txt)'; then
            echo "::error::Phát hiện tệp nghi vấn chứa chứng chỉ xác thực"
            exit 1
          fi
          if git grep -nIE '(sk-[0-9A-Za-z]{48,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.)' -- ':!*.md' ':!.github/workflows/*'; then
            echo "::error::Phát hiện khóa bảo mật nghi vấn bị hardcode"
            exit 1
          fi
          echo "Quét chứng chỉ xác thực vượt qua thành công"

  publish:
    name: Xây dựng và đẩy image đa kiến trúc lên Docker Hub
    runs-on: ubuntu-latest
    # Bỏ qua khi chưa cấu hình biến kho lưu trữ Docker Hub (ví dụ: bản fork), tránh thất bại không cần thiết
    if: ${{ vars.DOCKERHUB_REPOSITORY != '' }}
    needs: gate
    # Môi trường phát hành: có thể gán người phê duyệt bắt buộc trong cài đặt kho lưu trữ (kế hoạch §20.3)
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tính toán thẻ (tag) image
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}
          # Tắt tùy chọn mặc định latest=auto, chuyển sang kiểm soát tường minh bên dưới
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # latest **CHỈ** gắn với Release chính thức. Trước đây tính cả tag v* dạng thô, dẫn đến việc tạo nhầm một
            # tag sẽ âm thầm ghi đè latest, mâu thuẫn với quy tắc đã nêu ở đầu tệp này.
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Cài đặt cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Xây dựng và đẩy image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Ký xác thực không cần khóa (Keyless signing): Chứng chỉ được Sigstore cấp dựa trên định danh GitHub OIDC, không cần lưu private key trong kho.
      # Cách xác minh (ghi trong README):
      #   cosign verify docker.io/<username>/m365-codex:<tag> \
      #     --certificate-identity-regexp '^https://github.com/.+/M365-Codex/.github/workflows/release.yml@.+' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Ký image bằng cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Xuất danh sách thẻ đã đẩy
        run: |
          echo "Đã đẩy các thẻ image sau lên Docker Hub:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Mã băm image (digest): ${{ steps.build.outputs.digest }} (đã ký không cần khóa bằng cosign)"
