name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Quyền hạn tối thiểu: CI chỉ cần đọc mã nguồn
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Kiểm tra kiểu / Lint / Kiểm thử
    runs-on: ubuntu-latest
    steps:
      # Action luôn được cố định theo commit SHA nhằm ngăn chặn tag bị trỏ lại
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Kiểm tra kiểu
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Kiểm thử đơn vị và tích hợp
        run: npm test

      # Giao diện quản trị không nằm trong workspace gốc (cây phụ thuộc frontend hoàn toàn tách biệt với server,
      # phân tách lockfile riêng giúp quản lý sạch sẽ hơn), do đó cần cài đặt phụ thuộc và chạy kiểm tra riêng biệt
      - name: Cài đặt phụ thuộc giao diện quản trị
        run: npm ci --prefix apps/web
      - name: Kiểm tra kiểu giao diện quản trị
        run: npm run typecheck:web
      - name: Kiểm thử giao diện quản trị
        run: npm run test:web
      - name: Xây dựng giao diện quản trị
        run: npm run build --prefix apps/web

  security:
    name: Quét lỗ hổng phụ thuộc và chứng chỉ rò rỉ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Quét lỗ hổng phụ thuộc (chặn mức high trở lên)
        run: npm audit --audit-level=high
      - name: Quét rò rỉ chứng chỉ xác thực
        run: |
          set -euo pipefail
          echo "Kiểm tra xem có sơ suất commit tệp .env hoặc tệp tài khoản hay không"
          # Mẫu loại trừ bắt buộc phải cho phép .env.example ở **mọi cấp thư mục**: nếu chỉ neo tại thư mục gốc của kho,
          # các tệp ví dụ của gói con như apps/web/.env.example sẽ bị phán đoán nhầm là tệp thông tin xác thực.
          if git ls-files | grep -Ev '(^|/)\.env\.example$' | grep -E '(^|/)(\.env($|\.)|accounts?\.json|tokens?\.json|cookies\.txt)'; then
            echo "::error::Phát hiện tệp nghi vấn chứa chứng chỉ xác thực được commit"
            exit 1
          fi
          echo "Kiểm tra xem mã nguồn có xuất hiện dạng khóa bảo mật bị hardcode hay không"
          if git grep -nIE '(sk-[0-9A-Za-z]{48,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.)' -- ':!*.md' ':!.github/workflows/*'; then
            echo "::error::Phát hiện API Key hoặc JWT nghi vấn bị hardcode"
            exit 1
          fi
          echo "Quét chứng chỉ xác thực vượt qua thành công"

  docker:
    name: Xây dựng image và kiểm tra sức khỏe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Xây dựng image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: m365-codex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Khởi động container và xác minh /healthz cùng /readyz
        run: |
          set -euo pipefail
          MASTER_KEY="$(openssl rand -base64 32)"
          docker run -d --name m365-codex-ci -p 8080:8080 \
            -e M365_CODEX_MASTER_KEY="$MASTER_KEY" \
            -e M365_CODEX_ADMIN_PASSWORD='ci-only-throwaway-password' \
            m365-codex:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Container không sẵn sàng trong vòng 30 giây"
              docker logs m365-codex-ci
              exit 1
            fi
            sleep 1
          done

          echo "healthz: $(curl -fsS http://127.0.0.1:8080/healthz)"
          echo "readyz:  $(curl -fsS http://127.0.0.1:8080/readyz)"

          # Danh mục mô hình bắt buộc phải thực sự được sao chép vào image. Khi không đọc được, mã nguồn sẽ âm thầm lùi về danh mục tích hợp sẵn chỉ chứa 1 mô hình,
          # trên môi trường thực tế từng chỉ trả về 1 mô hình trong khi config/models.json có 3 mô hình — so sánh số lượng để đảm bảo tính toàn vẹn.
          echo "Xác minh số lượng danh mục mô hình khớp với config/models.json"
          EXPECTED=$(node -e "console.log(require('./config/models.json').data.length)")
          ACTUAL=$(docker exec m365-codex-ci node -e "console.log(require('/app/config/models.json').data.length)")
          echo "  Kỳ vọng $EXPECTED mục, trong image có $ACTUAL mục"
          test "$EXPECTED" = "$ACTUAL"

          echo "Xác minh sản phẩm build giao diện quản trị đã được phát hành kèm image"
          curl -fsS http://127.0.0.1:8080/ui/ | grep -q 'id="root"'

          echo "Xác minh container chạy dưới quyền non-root"
          test "$(docker exec m365-codex-ci id -u)" != "0"

          echo "Xác minh SIGTERM thoát êm đẹp (graceful shutdown)"
          docker stop --timeout 15 m365-codex-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' m365-codex-ci)" = "0"

      # Quét lỗ hổng image: chỉ chặn mức HIGH/CRITICAL và chỉ tính các lỗi đã có bản vá sửa chữa (các lỗ hổng base image
      # chưa có bản vá nếu chặn phát hành sẽ không có ý nghĩa, việc đó thuộc về quá trình cập nhật base image theo định kỳ)
      - name: Quét lỗ hổng image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: m365-codex:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Xác minh đảo ngược: Hàng rào bảo vệ yêu cầu "từ chối khởi động nếu thiếu Master Key", ở đây dùng container thật để kiểm chứng.
      # Gộp chung vào cùng một job với bài test smoke ở trên để tái sử dụng image đã build — nếu tách riêng job khác
      # sẽ phải build lại một lần nữa, vừa chậm vừa tăng nguy cơ kéo gói từ xa thất bại ngẫu nhiên.
      - name: Phải thoát khi chưa thiết lập M365_CODEX_MASTER_KEY
        run: |
          set -euo pipefail
          if docker run --rm -e M365_CODEX_ADMIN_PASSWORD='ci-only-throwaway-password' m365-codex:ci; then
            echo "::error::Container khởi động thành công dù thiếu Master Key"
            exit 1
          fi
          echo "Đúng như kỳ vọng: từ chối khởi động khi thiếu Master Key"

      - name: Dọn dẹp
        if: always()
        run: docker rm -f m365-codex-ci || true
